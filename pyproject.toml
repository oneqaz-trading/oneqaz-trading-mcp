[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "oneqaz-trading-mcp"
version = "0.5.0"
description = "MCP server for trading signal analysis, position monitoring, market regime detection, and Trust Layer (B2AI credibility verification)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
keywords = [
    "mcp", "trading", "signals", "market-analysis", "fastmcp",
    "crypto", "stocks", "regime", "fear-greed", "positions",
    "portfolio", "technical-analysis", "sentiment", "claude",
    "model-context-protocol",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "fastmcp>=2.14,!=3.*,<5",  # tested: 2.14.7 and 4.0.11 / 4.1.0 (3.x untested)
    "psycopg[binary,pool]>=3.1",
    "holidays>=0.40",  # entity session: KRX / NYSE holiday calendars
    "tzdata>=2024.1",  # zoneinfo on Windows (no system tz database)
]

[project.scripts]
oneqaz-trading-mcp = "oneqaz_trading_mcp.cli:main"

[project.urls]
Homepage = "https://github.com/oneqaz-trading/oneqaz-trading-mcp"
Repository = "https://github.com/oneqaz-trading/oneqaz-trading-mcp"
Issues = "https://github.com/oneqaz-trading/oneqaz-trading-mcp/issues"

[tool.setuptools.packages.find]
where = ["src"]
